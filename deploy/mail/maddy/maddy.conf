# Maddy configuration file (v0.7+)
# Standard setup for DocNear (RxDesk)

$(hostname) = {env:MADDY_HOSTNAME}
$(primary_domain) = {env:MADDY_DOMAIN}
$(local_domains) = $(primary_domain)

# Global hostname directive required by SMTP/Submission modules
hostname $(hostname)

# TLS Configuration
tls self_signed $(hostname) maddy
# For production, once certificates are ready, use:
# tls /data/tls/fullchain.pem /data/tls/privkey.pem

# ----------------------------------------------------------------------------
# Authentication and Storage

# Authentication configuration
auth.pass_table local_authdb {
    table sql_table {
        driver sqlite3
        dsn /data/maddy.db
        table_name passwords
    }
}

# Storage configuration
storage.imapsql local_mailboxes {
    driver sqlite3
    dsn /data/./maddy.db
}

# ----------------------------------------------------------------------------
# Routing and Rewrites

table.chain local_rewrites {
    optional_step static {
        entry postmaster postmaster@$(primary_domain)
    }
}

msgpipeline local_routing {
    destination postmaster $(local_domains) {
        modify {
            replace_rcpt &local_rewrites
        }
        deliver_to &local_mailboxes
    }
    default_destination {
        reject 550 5.1.1 "User doesn't exist"
    }
}

# ----------------------------------------------------------------------------
# SMTP Endpoints

# Inbound SMTP (Port 25)
smtp tcp://0.0.0.0:25 {
    source $(local_domains) {
        reject 501 5.1.8 "Use Submission for outgoing SMTP"
    }
    default_source {
        destination postmaster $(local_domains) {
            deliver_to &local_routing
        }
        default_destination {
            reject 550 5.1.1 "User doesn't exist"
        }
    }
}

# Submission (Port 587 and 465)
submission tls://0.0.0.0:465 tcp://0.0.0.0:587 {
    auth &local_authdb
    source $(local_domains) {
        check {
            authorize_sender
        }
        destination postmaster $(local_domains) {
            deliver_to &local_routing
        }
        default_destination {
            deliver_to &remote_queue
        }
    }
    default_source {
        reject 501 5.1.8 "Non-local sender domain"
    }
}

# ----------------------------------------------------------------------------
# IMAP Endpoints

# IMAP (Port 143 and 993)
imap tls://0.0.0.0:993 tcp://0.0.0.0:143 {
    auth &local_authdb
    storage &local_mailboxes
}

# ----------------------------------------------------------------------------
# Remote Sending Logic

target.remote remote_sending {
    limits {
        all concurrency 10
    }
}

target.queue remote_queue {
    target &remote_sending
}

# ----------------------------------------------------------------------------
# Logging

log stderr
