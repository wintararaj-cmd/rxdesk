# Maddy configuration file (v0.7+)
# Standard setup for DocNear (RxDesk)

$(hostname) = {env:MADDY_HOSTNAME}
$(primary_domain) = {env:MADDY_DOMAIN}
$(local_domains) = $(primary_domain)

# TLS Configuration
# For production, replace 'self_signed' with:
# loader file /data/tls/fullchain.pem /data/tls/privkey.pem
tls self_signed

# ----------------------------------------------------------------------------
# Submission (SMTP for local users) - Port 587
submission submission {
    bind :587
    auth sqlitedb {
        driver sqlite3
        dsn /data/maddy.db
    }
    source $(primary_domain) {
        check {
            authorize_sender
        }
        destination postmaster {
             deliver_to &local_mailboxes
        }
        destination $(local_domains) {
             deliver_to &local_mailboxes
        }
        destination * {
             deliver_to &remote_queue
        }
    }
}

# Inbound SMTP (Receiving from internet) - Port 25
smtp mx_inbound {
    bind :25
    source * {
        destination postmaster {
             deliver_to &local_mailboxes
        }
        destination $(local_domains) {
             deliver_to &local_mailboxes
        }
        destination * {
             reject "Recipient address is not local"
        }
    }
}

# IMAP Endpoint - Port 143 (StartTLS supported)
imap imap_endpoint {
    bind :143
    auth sqlitedb {
        driver sqlite3
        dsn /data/maddy.db
    }
    storage &local_mailboxes
}

# IMAPS Endpoint - Port 993
imap imaps_endpoint {
    bind :993
    auth sqlitedb {
        driver sqlite3
        dsn /data/maddy.db
    }
    storage &local_mailboxes
}

# SMTPS (Port 465)
submission smtps_endpoint {
    bind :465
    auth sqlitedb {
        driver sqlite3
        dsn /data/maddy.db
    }
    # Same logic as submission
    source $(primary_domain) {
        check {
            authorize_sender
        }
        destination * {
             deliver_to &remote_queue
        }
    }
}

# ----------------------------------------------------------------------------
# Storage definition (referenced by &local_mailboxes)
storage.imapsql local_mailboxes {
    driver sqlite3
    dsn /data/maddy.db
}

# ----------------------------------------------------------------------------
# Remote Sending Logic
target.remote remote_queue {
    limits {
        max_conns 10
    }
}

# ----------------------------------------------------------------------------
# Logging
log stderr
